<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="920" height="470" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">z3-og — clean-stack SMT architecture</text>

  <!-- solver pipeline -->
  <rect x="20" y="55" width="880" height="120" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="36" y="76" font-size="12" font-weight="bold" fill="#3730a3">SOLVER (src/, C11)</text>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <rect x="36" y="90" width="110" height="52" rx="6" fill="#ffffff" stroke="#6366f1"/>
    <text x="91" y="112">SMT-LIB 2</text><text x="91" y="129">parser</text>
    <rect x="176" y="90" width="110" height="52" rx="6" fill="#ffffff" stroke="#6366f1"/>
    <text x="231" y="112">hash-consed</text><text x="231" y="129">AST</text>
    <rect x="316" y="90" width="110" height="52" rx="6" fill="#ffffff" stroke="#6366f1"/>
    <text x="371" y="112">Tseitin</text><text x="371" y="129">encoding</text>
    <rect x="456" y="90" width="130" height="52" rx="6" fill="#ffffff" stroke="#6366f1"/>
    <text x="521" y="112">DPLL SAT core</text><text x="521" y="129">(v2: CDCL(T))</text>
    <rect x="616" y="90" width="268" height="52" rx="6" fill="#ffffff" stroke="#6366f1"/>
    <text x="750" y="112">theory check: congruence closure (QF_UF)</text><text x="750" y="129">+ exact integer arithmetic (QF_LIA)</text>
  </g>
  <g stroke="#4f46e5" stroke-width="2" fill="none">
    <path d="M146 116 L172 116"/><path d="M286 116 L312 116"/><path d="M426 116 L452 116"/><path d="M586 116 L612 116"/>
  </g>

  <!-- kernel + crypto -->
  <rect x="20" y="195" width="430" height="105" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="36" y="216" font-size="12" font-weight="bold" fill="#065f46">TRUSTED KERNEL (kernel-ocaml/, opam package)</text>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <rect x="36" y="228" width="190" height="52" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="131" y="250">ground congruence checker</text><text x="131" y="267">hash-consed terms</text>
    <rect x="242" y="228" width="190" height="52" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="337" y="250">hash-chained assertion log</text><text x="337" y="267">tamper-evident (FNV-1a-64)</text>
  </g>

  <rect x="470" y="195" width="430" height="105" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="486" y="216" font-size="12" font-weight="bold" fill="#92400e">CRYPTO (crypto/, C11, hand-rolled)</text>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <rect x="486" y="228" width="124" height="52" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="548" y="250">SHA-256</text><text x="548" y="267">FIPS 180-4</text>
    <rect x="622" y="228" width="124" height="52" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="684" y="250">HMAC</text><text x="684" y="267">RFC 2104/4231</text>
    <rect x="758" y="228" width="126" height="52" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="821" y="250">Merkle roots</text><text x="821" y="267">domain-separated</text>
  </g>

  <!-- CA layer -->
  <rect x="20" y="320" width="880" height="120" rx="8" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="36" y="341" font-size="12" font-weight="bold" fill="#9d174d">FLAT-ARRAY LAYER (cellular automata &#8594; constraints)</text>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <rect x="36" y="355" width="250" height="52" rx="6" fill="#ffffff" stroke="#db2777"/>
    <text x="161" y="377">wolfram-flat (Rust, no_std)</text><text x="161" y="394">caller-owned u64 buffers, zero heap</text>
    <rect x="330" y="355" width="250" height="52" rx="6" fill="#ffffff" stroke="#db2777"/>
    <text x="455" y="377">rulec (tools/, C11)</text><text x="455" y="394">symbolic rule compiler &#8594; SMT-LIB</text>
    <rect x="624" y="355" width="260" height="52" rx="6" fill="#ffffff" stroke="#db2777"/>
    <text x="754" y="377">solver decides the constraints</text><text x="754" y="394">verified exhaustively at width 5</text>
  </g>
  <g stroke="#be185d" stroke-width="2" fill="none">
    <path d="M286 381 L326 381"/><path d="M580 381 L620 381"/>
  </g>

  <text x="460" y="462" text-anchor="middle" font-size="11" fill="#6b7280">F* verified layer (fstar/): zero-sorry proofs, KreMLin extraction to C99 &#183; v2 contract: docs/ARCHITECTURE-CDCLT.md</text>
</svg>
